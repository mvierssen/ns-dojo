$schema: https://moonrepo.dev/schemas/project.json
layer: library
language: typescript
tags:
  - typescript
  - tenant-shared
dependsOn:
  - shared-core
tasks:
  build:
    deps:
      - ^:build
      - eslint-config-node:build
      - ts-config-lib-compiled:build
      - vite-config-base:build
      - vitest-config-node:build

  dev:
    command: "npm run dev"
    options:
      runInCI: false

  docker-build:
    command: "docker build -t ghcr.io/mvierssen/kata-antenna:latest -f packages/katas/kata-antenna/Dockerfile ."
    deps:
      - build
    options:
      runFromWorkspaceRoot: true
      cache: false

  docker-push:
    command: "docker push ghcr.io/mvierssen/kata-antenna:latest"
    deps:
      - docker-build
    options:
      cache: false

  docker-run:
    command: "docker run -it --rm ghcr.io/mvierssen/kata-antenna:latest"
    deps:
      - docker-build
    options:
      runInCI: false

  ci-publish:
    command: echo 'ci-publish complete'
    deps:
      - docker-push
    options:
      cache: false
