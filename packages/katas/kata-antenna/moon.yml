$schema: https://moonrepo.dev/schemas/project.json
layer: library
language: typescript
tags:
  - typescript
  - tenant-shared
dependsOn:
  - shared-core
tasks:
  build:
    deps:
      - ^:build
      - eslint-config-node:build
      - ts-config-lib-compiled:build
      - vite-config-base:build
      - vitest-config-node:build

  dev:
    command: "npm run dev"

    options:
      runInCI: false

  docker-build:
    command: "docker build -t kata-antenna -f packages/katas/kata-antenna/Dockerfile ."
    options:
      runFromWorkspaceRoot: true

  docker-run:
    command: "docker run -it --rm kata-antenna"
    deps:
      - docker-build

    options:
      runInCI: false
