# Shared tasks for Node.js library packages
# https://moonrepo.dev/docs/config/tasks
# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json

$schema: https://moonrepo.dev/schemas/tasks.json

implicitInputs:
  - "package.json"
  - "tsconfig*.json"

fileGroups:
  sources:
    - "src/**/*"
  tests:
    - "src/**/*.test.*"
    - "src/**/*.spec.*"
    - "test/**/*"
  configs:
    - "*.config.*"
    - ".eslintrc*"
    - ".prettierrc*"

tasks:
  build:
    deps:
      - "^:build"
    command:
      - "npm"
      - "run"
      - "build"
    inputs:
      - "@globs(sources)"
      - "tsconfig*.json"
    outputs:
      - "dist"
    options:
      cache: true

  test:
    command:
      - "npm"
      - "test"
    deps:
      - '^:build'
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true

  test-watch:
    command:
      - "npm"
      - "run"
      - "test:watch"
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: false
      persistent: true

  lint:
    command:
      - "npm"
      - "run"
      - "lint"
    deps:
      - build
      - "^:build"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: true

  lint-fix:
    command:
      - "npm"
      - "run"
      - "lint:fix"
    deps:
      - build
      - "^:build"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs: []
    options:
      cache: false

  fmt:
    command:
      - "npm"
      - "run"
      - "fmt"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "*.json"
      - "*.md"
    outputs: []
    options:
      cache: false

  fmt-check:
    command:
      - "npm"
      - "run"
      - "fmt:check"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
      - "*.json"
      - "*.md"
    outputs: []
    options:
      cache: true

  typecheck:
    command:
      - "npm"
      - "run"
      - "typecheck"
    deps:
      - build
      - "^:build"
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "tsconfig*.json"
    outputs: []
    options:
      cache: true

  coverage:
    command:
      - "npm"
      - "run"
      - "coverage"
    deps:
      - '^:build'
    inputs:
      - "@globs(sources)"
      - "@globs(tests)"
      - "@globs(configs)"
    outputs:
      - "coverage"
    options:
      cache: true

  # Clean build artifacts
  clean:
    script: rm -rf dist
    options:
      cache: false

  # CI aggregate task
  ci-check:
    command: echo 'ci-check complete'
    deps:
      - build
      - test
      - lint
      - typecheck
    options:
      cache: false

inheritedBy:
  tag: typescript
