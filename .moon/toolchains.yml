# Moonrepo toolchain configuration
# https://moonrepo.dev/docs/config/toolchain
# yaml-language-server: $schema=https://moonrepo.dev/schemas/toolchain.json

$schema: "https://moonrepo.dev/schemas/toolchain.json"

node:
  version: null

npm:
  version: null
  installArgs: ["--no-save"]

typescript:
  createMissingConfig: false
  syncProjectReferences: true
  syncProjectReferencesToPaths: true

javascript:
  dedupeOnLockfileChange: false
  packageManager: "npm"
  syncPackageManagerField: true
  syncProjectWorkspaceDependencies: true
  dependencyVersionFormat: "version-caret"
